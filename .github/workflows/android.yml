name: Test and build Android app

# Every push to main and every pull request: typecheck, test, and build a
# signed APK (kept as a download on the run). Publishing a release on GitHub
# does the same and attaches the APK to that release.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the APK to a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx cap sync android

      - name: Set version
        # Releases use their tag (v1.2 → 1.2). Other builds are named after the commit.
        # The version code only goes up, so Android installs each build as an update.
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          echo "VERSION_CODE=$((GITHUB_RUN_NUMBER + 1))" >> "$GITHUB_ENV"
          if [ -n "$TAG" ]; then
            echo "VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"
            echo "APK_NAME=pips-${TAG#v}.apk" >> "$GITHUB_ENV"
          else
            echo "VERSION_NAME=dev-${GITHUB_SHA::7}" >> "$GITHUB_ENV"
            echo "APK_NAME=pips-dev-${GITHUB_SHA::7}.apk" >> "$GITHUB_ENV"
          fi

      - name: Unpack signing key
        # Pull requests from forks get no secrets; they build an unsigned APK.
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key in secrets: the APK will be unsigned and can't be installed."
          fi

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --no-daemon
          apk=$(ls app/build/outputs/apk/release/*.apk | head -1)
          mv "$apk" "$GITHUB_WORKSPACE/$APK_NAME"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: ${{ env.APK_NAME }}

      - name: Attach APK to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$APK_NAME" --clobber

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
